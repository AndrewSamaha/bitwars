# Entity type definitions — M4: Data-Driven Entities
# M7: Resource type definitions for display (name, order) in HUD and elsewhere.
#
# This file is the source of truth for entity properties. The engine loads it
# at startup and computes a deterministic content hash (canonicalized JSON,
# xxh3-64) for version pinning.
#
# Rules:
# - entity_type_id is the YAML key (e.g. "worker"). Never recycle IDs.
# - All numeric values are floats. Add new fields with serde defaults so
#   existing definitions don't break.
# - maintenance_cost_per_minute values are charged continuously to the owner.

# M7: Resource types (id = key). Display order and name for HUD; theme-agnostic.
resource_types:
  food:
    display_name: Food
    order: 0
  minerals:
    display_name: Minerals
    order: 1
  energy:
    display_name: Energy
    order: 2

entity_types:
  theta:
    speed: 0.0
    z_index: -10
    suppress_hover: true
    stop_radius: 0.75
    mass: 500.0
    health: 100.0
    resource_node:
      resource_type: energy
      collection_mode: proximity
      min_effective_distance: 350.0
      max_effective_distance: 1600.0

  planet_blue:
    speed: 0.0
    z_index: -1
    suppress_hover: true
    stop_radius: 1
    mass: 500.0
    health: 100.0
    visual_scale: 4.0
    resource_node:
      resource_type: food
      collection_mode: transport
      min_effective_distance: 20.0
      max_effective_distance: 50.0
  
  star_yellow:
    speed: 0.0
    z_index: -10
    suppress_hover: true
    stop_radius: 1
    mass: 500.0
    health: 100.0
    visual_scale: 15.0
    radiation_sources:
      - radiation_type: stellar_heat
        min_effective_distance_border_color:
        min_effective_distance_fill_color: "#ef4444"
        full_damage_distance_border_color:
        full_damage_distance_fill_color: "#f97316"
        max_effective_distance_border_color:
        max_effective_distance_fill_color: "#facc15"
        min_effective_distance: 0.0
        full_damage_distance: 600.0
        max_effective_distance: 1200.0
        damage_per_second: 2.0
    resource_node:
      resource_type: energy
      collection_mode: proximity
      min_effective_distance: 10.0
      max_effective_distance: 800.0

  minerals:
    speed: 0.0
    stop_radius: 1
    mass: 500.0
    health: 100.0
    resource_node:
      resource_type: minerals
      collection_mode: transport
      min_effective_distance: 20.0
      max_effective_distance: 50.0

  collector_solar:
    speed: 20.0
    stop_radius: 1
    mass: 500.0
    health: 100.0
    combat_targetable: true
    build_cost:
      minerals: 100.0
      energy: 50.0
    radiation_shielding:
      stellar_heat:
        distance_offset: 90.0
        damage_multiplier: 0.35
    collector:
      collects: [energy]
      proximity_rate_per_second: 12.0
      transport_rate_per_second: 0.0
      carry_capacity: 0.0


  worker:
    speed: 90.0
    stop_radius: 0.75
    mass: 1.0
    health: 100.0
    combat_targetable: true
    build_cost:
      minerals: 50.0
      energy: 50.0
    maintenance_cost_per_minute:
      energy: 1.0
      food: 2.0
    collector:
      collects: [minerals, food]
      transport_rate_per_second: 10.0
      carry_capacity: 120.0
      deposit_entity_types: [processor, habitat]
    builds:
      - entity_type_id: collector_solar
        spend_rates:
          minerals: 1.2
          energy: 1.2
      - entity_type_id: habitat
        spend_rates:
          minerals: 1.2
          energy: 1.2
      - entity_type_id: defense_pilon
        spend_rates:
          minerals: 1.2
          energy: 1.2


  habitat:
    speed: 70.0
    stop_radius: 0.5
    mass: 4.0
    health: 400.0
    combat_targetable: true
    refinery:
      accepts: [food]
    build_cost:
      minerals: 1000.0
      energy: 1000.0
    maintenance_cost_per_minute:
      energy: 5.0
      food: 10.0
    builds:
      - entity_type_id: worker
        spend_rates:
          minerals: 0.8
          energy: 0.8

  processor:
    speed: 60.0
    stop_radius: 0.5
    mass: 7.0
    health: 150.0
    combat_targetable: true
    maintenance_cost_per_minute:
      energy: 1.0
      food: 2.0
    refinery:
      accepts: [minerals]

  factory:
    speed: 60.0
    stop_radius: 0.5
    mass: 7.0
    health: 150.0
    combat_targetable: true

  scout:
    speed: 140.0
    stop_radius: 0.5
    mass: 0.6
    health: 60.0
    combat_targetable: true
    combat:
      attack_range: 120.0
      damage: 2.0
      cooldown_ticks: 75
      acquisition_range: 450.0
      on_near_enemy_strategy: approach

  defense_pilon:
    build_cost:
      minerals: 100.0
      energy: 50.0
    speed: 5.0
    stop_radius: 0.5
    mass: 1.0
    health: 500.0
    combat:
      attack_range: 500.0
      damage: 2.0
      cooldown_ticks: 51
      acquisition_range: 500.0
      on_near_enemy_strategy: stay

  raider:
    speed: 10.0
    stop_radius: 0.5
    mass: 0.8
    health: 80.0
    combat_targetable: true
    combat:
      attack_range: 180.0
      damage: 4.0
      cooldown_ticks: 100
      acquisition_range: 500.0
      on_near_enemy_strategy: approach
