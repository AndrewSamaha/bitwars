syntax = "proto3";
package bitwars;

import "entity.proto";
import "collector_state.proto";
import "combat_effect_state.proto";

// M7: Per-player resource totals. Resource types are data-driven (string IDs).
message ResourceEntry {
  string resource_type = 1;
  int64 amount = 2;
  // Cumulative authoritative spending for this resource. This includes upkeep
  // demand even when the ledger is clamped at zero.
  double spend_total = 3;
  // Cumulative collection/resource income, including fractional accrual.
  double gain_total = 4;
}

message PlayerResourceLedger {
  string player_id = 1;
  repeated ResourceEntry resources = 2;
}

// Technologies completed by a player. Technology definitions are supplied by
// the versioned content pack; this is only mutable match state.
message PlayerTechnologyState {
  string player_id = 1;
  repeated string technology_ids = 2;
}

message Snapshot {
  int64 tick = 2;
  repeated Entity entities = 3;
  repeated PlayerResourceLedger player_ledgers = 4;
  repeated CollectorState collector_states = 5;
  repeated CombatEffectState combat_effect_states = 6;
  repeated PlayerTechnologyState player_technologies = 7;
}
