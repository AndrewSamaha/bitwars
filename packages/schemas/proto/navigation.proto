syntax = "proto3";
package bitwars;

import "vec2.proto";

// Route traversal is independent of movement, formation, and combat ownership.
enum RouteTraversal {
  ROUTE_TRAVERSAL_UNSPECIFIED = 0;
  FINISH_AT_END = 1;
  PING_PONG = 2;
}

message NavigationRoute {
  repeated Vec2 waypoints = 1;
  uint32 next_waypoint_index = 2;
  // +1 for forward traversal; -1 for backward traversal.
  sint32 direction = 3;
  RouteTraversal traversal = 4;
}

// Saved with world positions; root identity is preserved by waypoint edits.
message MoveOrderState {
  uint64 entity_id = 1;
  bytes intent_id = 2;
  bytes client_cmd_id = 3;
  string player_id = 4;
  uint64 started_tick = 5;
  NavigationRoute route = 6;
}
