    speed: 0.0
    z_index: -10
    suppress_hover: true
    stop_radius: 0.75
    mass: 500.0
    health: 100.0
    visibility_range: 4000.0
    visual_scale: 2.0
    radiation_sources:
      - radiation_type: theta
        min_effective_distance_border_color:
        min_effective_distance_fill_color: "#882cd6"
        full_damage_distance_border_color:
        full_damage_distance_fill_color: "#a753ef"
        max_effective_distance_border_color:
        max_effective_distance_fill_color: "#c384f8"
        min_effective_distance: 0.0
        full_damage_distance: 700.0
        max_effective_distance: 1200.0
        damage_per_second: 6.0
    resource_node:
      resource_type: energy
      collection_mode: proximity
