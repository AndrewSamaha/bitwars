syntax = "proto3";
package bitwars;

import "entity.proto";
import "intent.proto";
import "navigation.proto";
import "collector_state.proto";
import "combat_effect_state.proto";

// M7: Per-player resource totals. Resource types are data-driven (string IDs).
message ResourceEntry {
  string resource_type = 1;
  int64 amount = 2;
  // Cumulative authoritative spending for this resource. This includes upkeep
  // demand even when the ledger is clamped at zero.
  double spend_total = 3;
  // Cumulative collection/resource income, including fractional accrual.
  double gain_total = 4;
}

message PlayerResourceLedger {
  string player_id = 1;
  repeated ResourceEntry resources = 2;
}

// Technologies completed by a player. Technology definitions are supplied by
// the versioned content pack; this is only mutable match state.
message PlayerTechnologyState {
  string player_id = 1;
  repeated string technology_ids = 2;
}

// Server-only collection checkpoint, saved with the worker position and cargo.
message CollectionOrderState {
  bytes client_cmd_id = 1;
  CollectState state = 2;
}

message Snapshot {
  // Server-only persistent player discovery history; omitted from player streams.
  string discovered_entities_json = 14;
  repeated CollectionOrderState collection_orders = 15;
  // Server checkpoint: versioned reservations and pending procedural starts.
  // Clients may ignore this JSON; it is persisted atomically with entities.
  string generation_state_json = 13;
  uint32 economy_version = 12; // 1 = depot logistics; earlier matches require reset
  int64 tick = 2;
  repeated Entity entities = 3;
  repeated PlayerResourceLedger player_ledgers = 4;
  repeated CollectorState collector_states = 5;
  repeated CombatEffectState combat_effect_states = 6;
  repeated PlayerTechnologyState player_technologies = 7;
  repeated ConvoyOrderState convoys = 8;
  repeated MoveOrderState move_orders = 9;
  repeated SentryOrderState sentry_orders = 10;
  repeated EscortOrderState escort_orders = 11;
}
