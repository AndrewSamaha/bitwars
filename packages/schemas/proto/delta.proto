syntax = "proto3";
package bitwars;

import "entity_delta.proto";
import "collector_state.proto";

message Delta {
  uint64 tick = 1;
  repeated EntityDelta updates = 2;
  // Entity IDs removed from the authoritative world since the previous delta.
  repeated uint64 removed_entity_ids = 3;
  repeated CollectorState collector_state_updates = 4;
}
