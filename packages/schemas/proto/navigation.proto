syntax = "proto3";
package bitwars;

import "vec2.proto";

// Route traversal is independent of movement, formation, and combat ownership.
enum RouteTraversal {
  ROUTE_TRAVERSAL_UNSPECIFIED = 0;
  FINISH_AT_END = 1;
  PING_PONG = 2;
}

message NavigationRoute {
  repeated Vec2 waypoints = 1;
  uint32 next_waypoint_index = 2;
  // +1 for forward traversal; -1 for backward traversal.
  sint32 direction = 3;
  RouteTraversal traversal = 4;
}

// Saved with world positions; root identity is preserved by waypoint edits.
message MoveOrderState {
  uint64 entity_id = 1;
  bytes intent_id = 2;
  bytes client_cmd_id = 3;
  string player_id = 4;
  uint64 started_tick = 5;
  NavigationRoute route = 6;
  // Last accepted route mutation; lets clients retire pending edit previews.
  bytes last_client_cmd_id = 7;
}

// Explicit owner and root identity allow private, stale-safe removal delivery.
message MoveOrderRemoval {
  uint64 entity_id = 1;
  string player_id = 2;
  bytes client_cmd_id = 3;
}

message ConvoySlot {
  uint64 entity_id = 1;
  Vec2 offset = 2;
}


enum SentryPhase {
  SENTRY_PHASE_UNSPECIFIED = 0;
  ASSEMBLING = 1;
  PATROLLING = 2;
  ENGAGED = 3;
  REGROUPING = 4;
}

message SentryOrderState {
  bytes intent_id = 1;
  bytes client_cmd_id = 2;
  string player_id = 3;
  uint64 started_tick = 4;
  NavigationRoute route = 5;
  Vec2 anchor = 6;
  repeated ConvoySlot slots = 7;
  SentryPhase phase = 8;
  bytes last_client_cmd_id = 9;
}

message SentryOrderRemoval {
  bytes client_cmd_id = 1;
  string player_id = 2;
}

// A reserved leader-relative slot survives temporary combat interruptions.
message EscortSlot {
  uint64 entity_id = 1;
  Vec2 offset = 2;
  uint32 slot_index = 3;
  // forming | in_formation | catching_up | engaging | returning
  string status = 4;
}

message EscortOrderState {
  bytes intent_id = 1;
  bytes client_cmd_id = 2;
  string player_id = 3;
  uint64 started_tick = 4;
  uint64 target_entity_id = 5;
  repeated EscortSlot slots = 6;
}

message EscortOrderRemoval {
  bytes client_cmd_id = 1;
  string player_id = 2;
}
