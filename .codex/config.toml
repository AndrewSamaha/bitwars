[mcp_servers.bitwars_player]
command = "sh"
args = ["-c", 'cd "$HOME/Development/bitwars/packages/player-mcp" && exec node --import tsx src/server.ts']
startup_timeout_sec = 30
tool_timeout_sec = 120
default_tools_approval_mode = "approve"
enabled = true
enabled_tools = [
  "connect_player",
  "observe_events",
  "get_player_state",
  "get_observation",
  "get_visible_entities",
  "get_changes",
  "get_command",
  "wait_for_observation",
  "set_progress_watch",
  "send_intent",
  "disconnect_player",
  "move_entity",
  "build_entity",
  "collect_resource",
]

[mcp_servers.bitwars_player.env]
BITWARS_PLAYER_MCP_BASE_URL = "http://127.0.0.1:3001"
BITWARS_PLAYER_MCP_ALLOW_WRITES = "1"

[mcp_servers.bitwars_game_query]
command = "sh"
args = ["-c", 'cd "$HOME/Development/bitwars/packages/player-mcp" && exec node --import tsx src/gameQueryServer.ts']
startup_timeout_sec = 30
tool_timeout_sec = 30
default_tools_approval_mode = "approve"
enabled = true
enabled_tools = ["get_snapshot", "get_owners", "get_entity", "get_scenarios", "get_script_debug"]

[mcp_servers.bitwars_game_query.env]
BITWARS_GAME_QUERY_BASE_URL = "http://127.0.0.1:3001"
