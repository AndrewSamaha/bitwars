syntax = "proto3";
package bitwars;

import "entity_delta.proto";
import "navigation.proto";
import "collector_state.proto";
import "combat_effect_state.proto";

message Delta {
  uint64 tick = 1;
  repeated EntityDelta updates = 2;
  // Entity IDs removed from the authoritative world since the previous delta.
  repeated uint64 removed_entity_ids = 3;
  repeated CollectorState collector_state_updates = 4;
  repeated CombatEffectState combat_effect_state_updates = 5;
  repeated MoveOrderState move_order_updates = 6;
  repeated MoveOrderRemoval move_order_removals = 7;
  repeated SentryOrderState sentry_order_updates = 8;
  repeated SentryOrderRemoval sentry_order_removals = 9;
  repeated EscortOrderState escort_order_updates = 10;
  repeated EscortOrderRemoval escort_order_removals = 11;
}
